<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESHA Parent Portal</title>
<meta name="theme-color" content="#263447">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#263447; --navy2:#34465f; --gold:#EEB943; --gold-soft:#fbf3dd; --maroon:#951F40; --bg:#f3f4f7; --card:#fff; --line:#e1e5ec; --muted:#5f6b7d; --ok:#1f7a4d; --ok-soft:#e5f4ec; --wait:#9a6700; --wait-soft:#fff4d6; }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:#1d2433; font-family:'Open Sans','Noto Sans Telugu',Arial,sans-serif; font-size:15px; line-height:1.45; }
  body.te { font-family:'Noto Sans Telugu','Open Sans',Arial,sans-serif; }
  button { font-family:inherit; }
  /* banner */
  .banner { position:relative; display:flex; align-items:center; gap:12px; background:#ececec; padding:10px 16px; overflow:hidden; }
  .banner img { height:58px; }
  .banner .t1 { font-family:'Open Sans',sans-serif; font-weight:700; color:var(--navy); font-size:34px; letter-spacing:9px; line-height:.95; }
  .banner .t2 { font-family:'Open Sans',sans-serif; font-weight:700; color:var(--navy); font-size:12px; letter-spacing:.3px; margin-top:3px; }
  .banner .wedge { position:absolute; right:0; top:0; bottom:0; width:36px; background:var(--gold); clip-path:polygon(55% 0,100% 0,100% 100%,0 100%); }
  .stripes i { display:block; } .stripes .g { height:4px; background:var(--gold); } .stripes .m { height:7px; background:var(--maroon); }
  .bar { max-width:760px; margin:0 auto; padding:10px 16px 0; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .bar .title { font-weight:800; color:var(--navy); font-size:18px; }
  .lang { display:flex; border:1.5px solid var(--navy); border-radius:20px; overflow:hidden; flex:none; }
  .lang button { border:0; background:#fff; color:var(--navy); padding:6px 12px; font-weight:700; font-size:13px; cursor:pointer; }
  .lang button.on { background:var(--navy); color:#fff; }
  .wrap { max-width:760px; margin:0 auto; padding:12px 16px 30px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin:12px 0; box-shadow:0 1px 2px rgba(20,30,50,.04); }
  /* login */
  .login { max-width:440px; margin:18px auto 0; }
  .login h2 { margin:0 0 4px; color:var(--navy); font-size:22px; }
  .login p { margin:0 0 6px; color:var(--muted); }
  label { display:block; font-weight:700; margin:14px 0 6px; font-size:14px; }
  .row { display:flex; }
  .pfx { display:flex; align-items:center; padding:0 12px; background:#eef0f4; border:1px solid #c9cfd9; border-right:none; border-radius:10px 0 0 10px; font-weight:800; color:var(--navy); }
  input[type=text], input[type=tel] { width:100%; padding:12px; font-size:17px; border:1px solid #c9cfd9; border-radius:10px; font-family:inherit; background:#fff; }
  .row input { border-radius:0 10px 10px 0; min-width:0; }
  input:focus { outline:2px solid var(--gold); outline-offset:1px; }
  .btn { display:block; width:100%; padding:14px; margin-top:18px; font-size:17px; font-weight:800; border:0; border-radius:12px; background:var(--navy); color:#fff; cursor:pointer; }
  .btn:disabled { opacity:.6; }
  .msg { margin-top:10px; color:#b42318; font-weight:700; }
  .hint { color:var(--muted); font-size:13px; margin-top:12px; }
  input[type=password] { width:100%; padding:12px; border:1px solid #c9cfd9; border-radius:10px; font-family:inherit; background:#fff; }
  .pinIn { font-size:26px !important; font-weight:800; letter-spacing:14px; text-align:center; }
  .who { display:flex; justify-content:space-between; align-items:center; gap:8px; background:#eef0f4; border-radius:10px; padding:10px 12px; margin-top:14px; font-weight:700; color:var(--navy); }
  .note { background:var(--gold-soft); border-left:4px solid var(--gold); border-radius:8px; padding:9px 11px; margin-top:12px; font-size:13px; color:#5b4a12; }
  .note:empty { display:none; }
  .lrow { display:flex; justify-content:flex-end; margin-top:6px; }
  /* children */
  .kids { display:flex; gap:10px; overflow-x:auto; padding:2px 0 6px; scrollbar-width:none; }
  .kid { display:flex; align-items:center; gap:10px; border:1.5px solid var(--line); background:#fff; border-radius:14px; padding:8px 14px 8px 8px; cursor:pointer; flex:none; text-align:left; }
  .kid .av { width:38px; height:38px; border-radius:50%; background:var(--gold-soft); color:var(--navy); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; }
  .kid b { display:block; color:var(--navy); font-size:14px; }
  .kid small { color:var(--muted); font-size:12px; }
  .kid.on { border-color:var(--navy); background:var(--navy); }
  .kid.on b, .kid.on small { color:#fff; }
  .kid.on .av { background:var(--gold); }
  /* dashboard */
  .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:12px 0; }
  @media (min-width:640px) { .stats { grid-template-columns:repeat(4,1fr); } }
  .stat { background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px; }
  .stat .n { font-size:26px; font-weight:800; color:var(--navy); line-height:1.1; }
  .stat .l { font-size:12.5px; color:var(--muted); margin-top:2px; }
  .stat.ok { border-left:4px solid var(--ok); } .stat.wait { border-left:4px solid var(--gold); } .stat.sent { border-left:4px solid var(--navy); } .stat.last { border-left:4px solid var(--maroon); }
  .stat.last .n { font-size:17px; padding-top:5px; }
  .latest { display:flex; gap:14px; align-items:center; background:linear-gradient(135deg,#fff 0%,var(--gold-soft) 100%); border:1px solid #edd9a1; }
  .latest .th { width:84px; height:108px; border-radius:8px; background:#eef0f4; flex:none; overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:28px; border:1px solid var(--line); }
  .latest .th img { width:100%; height:100%; object-fit:cover; object-position:top; }
  .latest .k { font-size:12px; font-weight:800; color:var(--maroon); text-transform:uppercase; letter-spacing:.5px; }
  .latest .s { font-size:18px; font-weight:800; color:var(--navy); }
  .latest .d { color:var(--muted); font-size:13px; }
  .open { margin-top:8px; border:0; background:var(--navy); color:#fff; border-radius:10px; padding:9px 16px; font-weight:800; cursor:pointer; font-size:14px; }
  /* filters */
  .filters { position:sticky; top:0; z-index:5; background:var(--bg); padding:8px 0 6px; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:2px 0 6px; scrollbar-width:none; }
  .chips::-webkit-scrollbar, .kids::-webkit-scrollbar { display:none; }
  .chip { flex:none; border:1.5px solid #c9cfd9; background:#fff; color:#1d2433; border-radius:20px; padding:6px 13px; font-size:13.5px; font-weight:700; cursor:pointer; }
  .chip.on { background:var(--navy); border-color:var(--navy); color:#fff; }
  .chip.date { position:relative; }
  .chip input[type=date] { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; }
  /* timeline */
  .day { display:flex; align-items:center; gap:8px; margin:20px 0 8px; font-weight:800; color:var(--navy); }
  .day::after { content:''; flex:1; height:2px; background:var(--gold); opacity:.7; }
  .sub { background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px; margin:10px 0; }
  .sub .hd { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .sub .nm { font-weight:800; color:var(--navy); font-size:16px; }
  .badge { font-size:12px; font-weight:800; border-radius:20px; padding:3px 10px; white-space:nowrap; }
  .badge.ok { background:var(--ok-soft); color:var(--ok); } .badge.wait { background:var(--wait-soft); color:var(--wait); }
  .strip { display:flex; gap:10px; overflow-x:auto; margin-top:10px; padding-bottom:4px; }
  .tile { flex:none; width:96px; cursor:pointer; border:0; background:none; padding:0; text-align:center; }
  .tile .im { width:96px; height:124px; border-radius:10px; background:#eef0f4; border:1px solid var(--line); overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:26px; color:#9aa4b2; }
  .tile .im img { width:100%; height:100%; object-fit:cover; object-position:top; display:block; }
  .tile.ai .im { border:2.5px solid var(--gold); background:var(--gold-soft); }
  .tile .cap { display:block; font-size:12px; font-weight:700; color:#374151; margin-top:4px; }
  .tile.ai .cap { color:var(--maroon); }
  .shimmer { background:linear-gradient(90deg,#eef0f4 25%,#f7f8fa 50%,#eef0f4 75%); background-size:200% 100%; animation:sh 1.2s infinite; }
  @keyframes sh { to { background-position:-200% 0; } }
  .empty { text-align:center; color:var(--muted); padding:30px 10px; }
  .more { display:block; margin:14px auto; border:1.5px solid var(--navy); background:#fff; color:var(--navy); border-radius:12px; padding:10px 20px; font-weight:800; cursor:pointer; }
  .top2 { display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
  .link { background:none; border:0; color:var(--maroon); font-weight:800; cursor:pointer; font-size:14px; }
  .upd { color:var(--muted); font-size:12px; }
  /* viewer */
  #viewer { position:fixed; inset:0; background:#121925; display:none; flex-direction:column; z-index:20; }
  #viewer .vb { display:flex; align-items:center; gap:8px; padding:10px 12px; color:#fff; }
  #viewer .vt { flex:1; min-width:0; } #viewer .vt b { display:block; font-size:15px; } #viewer .vt span { font-size:12px; opacity:.8; }
  #viewer .vb button, #viewer .vb a { background:#fff; color:var(--navy); border:0; border-radius:9px; padding:8px 12px; font-weight:800; font-size:14px; text-decoration:none; cursor:pointer; }
  #vbody { flex:1; overflow:auto; padding:8px; text-align:center; }
  #vbody img, #vbody canvas { max-width:100%; background:#fff; margin:0 auto 10px; display:block; border-radius:4px; }
  #vbody .load { color:#fff; padding:50px 0; }
  .nav { position:fixed; top:50%; transform:translateY(-50%); z-index:21; border:0; background:rgba(255,255,255,.9); color:var(--navy); width:42px; height:42px; border-radius:50%; font-size:22px; font-weight:800; cursor:pointer; display:none; }
  .nav.p { left:8px; } .nav.n { right:8px; }
  .foot { text-align:center; color:var(--muted); font-size:12px; margin:26px 0 8px; }
</style>
</head>

async function call(body) {

}

// group a child's items into submissions: date + subject
function groups(items) {
  const m = {};
  items.forEach(x => { const k = x.date + '|' + (x.subject || 'Other'); (m[k] = m[k] || { date:x.date, subject:x.subject || 'Other', ai:[], ph:[] })[x.kind === 'AI Review' ? 'ai' : 'ph'].push(x); });
  Object.values(m).forEach(g => { g.ph.sort((a,b) => a.name.localeCompare(b.name)); g.ai.sort((a,b) => b.name.localeCompare(a.name)); });
  return Object.values(m).sort((a,b) => (b.date + b.subject).localeCompare(a.date + a.subject) || 0).sort((a,b) => b.date.localeCompare(a.date));
}

  document.querySelectorAll('#subChips .chip').forEach(b => b.onclick = () => { fSub = b.dataset.s; shown = 8; render(); });
  const dayLabel = fDate === 'day' && fDay ? '📅 ' + fmt(fDay, { day:'numeric', month:'short' }) : t('pick');
  $('dateChips').innerHTML = ['all','week','month'].map(k => `<button class="chip ${fDate===k?'on':''}" data-d="${k}">${t(k==='all'?'allDates':k)}</button>`).join('') +
    `<span class="chip date ${fDate==='day'?'on':''}">${esc(dayLabel)}<input type="date" id="dpick" value="${fDay}"></span>`;
  document.querySelectorAll('#dateChips button.chip').forEach(b => b.onclick = () => { fDate = b.dataset.d; fDay=''; shown = 8; render(); });
  $('dpick').onchange = e => { fDay = e.target.value; fDate = fDay ? 'day' : 'all'; shown = 8; render(); };

// ---- thumbnails: load when visible, a few at a time ----
let io = null, queue = [], busy = false;
function observe() {
  if (io) io.disconnect();
  const els = [...document.querySelectorAll('[data-th]')];
  els.forEach(el => { const id = el.dataset.th; if (thumbCache[id] !== undefined) paint(el, thumbCache[id]); });
  if (!('IntersectionObserver' in window)) { els.forEach(el => want(el.dataset.th)); return; }
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { want(e.target.dataset.th); io.unobserve(e.target); } }), { rootMargin:'200px' });
  els.forEach(el => { if (thumbCache[el.dataset.th] === undefined) io.observe(el); });
}
function want(id) { if (thumbCache[id] !== undefined || thumbWait[id]) return; thumbWait[id] = 1; queue.push(id); pump(); }
async function pump() {
  if (busy || !queue.length || !S) return;
  busy = true; const batch = queue.splice(0, 8);
  try { const r = await call({ action:'thumbs', token:S.token, fids:batch }); batch.forEach(id => { thumbCache[id] = r.thumbs[id] || ''; }); }
  catch (e) { batch.forEach(id => { thumbCache[id] = ''; }); if (/log in|expired/i.test(e.message)) { busy = false; $('out').click(); $('err').textContent = e.message; return; } }
  batch.forEach(id => { delete thumbWait[id]; document.querySelectorAll(`[data-th="${id}"]`).forEach(el => paint(el, thumbCache[id])); });
  busy = false; pump();
}
function paint(el, src) { el.classList.remove('shimmer'); if (src) el.innerHTML = `<img src="${src}" alt="">`; }

// ---- viewer ----
function openView(list, i, g) { viewList = list; viewIdx = i; $('viewer').style.display = 'flex'; showItem(g); }
async function showItem(g) {
  const x = viewList[viewIdx], multi = viewList.length > 1;
  $('vprev').style.display = multi && viewIdx > 0 ? 'block' : 'none';
  $('vnext').style.display = multi && viewIdx < viewList.length - 1 ? 'block' : 'none';
  $('vtitle').textContent = (g ? g.subject + ' · ' : '') + (x.kind === 'AI Review' ? t('ai') : t('page') + ' ' + (viewIdx + 1 - viewList.filter(y => y.kind === 'AI Review').length));
  $('vsub').textContent = g ? t('given') + ': ' + fmt(g.date) : x.name;
  $('vbody').innerHTML = `<div class="load">${t('loading')}</div>`; $('vdl').removeAttribute('href');
  const myIdx = viewIdx;
  try {
    const f = await call({ action:'file', token: S.token, fid: x.fid });
    if (myIdx !== viewIdx) return;
    const bin = atob(f.data), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([bytes], { type: f.mime }));
    $('vdl').href = url; $('vdl').download = f.name;
    if (f.mime.indexOf('image/') === 0) { $('vbody').innerHTML = `<img src="${url}" alt="">`; return; }
    if (f.mime === 'application/pdf' && window.pdfjsLib) {
      const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
      $('vbody').innerHTML = '';
      const w = Math.min(window.innerWidth - 16, 900);
      for (let n = 1; n <= pdf.numPages; n++) {
        if (myIdx !== viewIdx) return;
        const page = await pdf.getPage(n), vp0 = page.getViewport({ scale: 1 });
        const vp = page.getViewport({ scale: (w / vp0.width) * Math.min(window.devicePixelRatio || 1, 2) });
        const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; c.style.width = w + 'px';
        $('vbody').appendChild(c);
        await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      }
      return;
    }
    $('vbody').innerHTML = `<div class="load"><a style="color:#fff" href="${url}" download="${esc(f.name)}">${t('save')}</a></div>`;
  } catch (e) {
    if (/log in|expired/i.test(e.message)) { closeView(); $('out').click(); $('err').textContent = e.message; return; }
    $('vbody').innerHTML = `<div class="load">${esc(e.message)}</div>`;
  }
}
function closeView() { $('viewer').style.display = 'none'; $('vbody').innerHTML = ''; $('vprev').style.display = $('vnext').style.display = 'none'; }
$('vclose').onclick = closeView;
$('vprev').onclick = () => { if (viewIdx > 0) { viewIdx--; showItem(currentG()); } };
